<!doctype html>
<!--
  Motion Studio — preview project shell (TEMPLATE).
  Produced by /studio (skills/motion-studio). Edit scene.js for choreography;
  this file is stable scaffolding — only touch it to change fonts / accent / copy.

  Seek contract (required for render.mjs, enforced by Anti-Slop G6):
    1. Plugins use DEFAULT imports from esm.sh (G4) — including GSDevTools.
    2. All motion wrapped in gsap.matchMedia with isMotionOK / isReduced.
    3. scene.js exposes window.__studio = { gsap, tl, duration }.
    4. GSDevTools.create() runs ONLY when !window.__RENDERING (set by render.mjs).
    5. document.fonts.ready gates any SplitText (Anti-Slop G6.5).
-->
<html lang="en" class="no-js">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Motion Studio — Preview</title>
    <!-- .js gate: entrance elements hide via .js selector so they stay visible if GSAP never loads (Anti-Slop D7) -->
    <script>document.documentElement.className = "js";</script>
    <style>
      :root {
        --paper: #f3efe7;        /* tinted neutral — never pure white */
        --ink:   #15140f;        /* tinted near-black — never pure black */
        --accent:#c2410c;        /* SINGLE locked accent (Anti-Slop F5 / F6) */
        --rule:  rgba(21,20,15,0.16);
        --ar: 16/9;              /* aspect ratio; dev: ?ar=9/16 ; render: viewport is the frame */
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 100%; height: 100%; background: var(--paper); color: var(--ink); -webkit-font-smoothing: antialiased; }
      body {
        font-family: "PP Neue Montreal", "Cabinet Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        display: flex; align-items: center; justify-content: center;
        overflow: hidden;
      }

      /* The stage fills the viewport. At render time the viewport IS the target
         aspect ratio, so the stage is exactly the output frame. */
      .stage {
        position: relative;
        width: 100vw; height: 100vh;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 28px; padding: 6vmin; text-align: center;
      }
      /* Optional dev preview frame: ?ar=9/16 constrains the stage to that ratio. */
      .preview-ar .stage {
        width: auto; height: auto; aspect-ratio: var(--ar);
        max-width: 100vw; max-height: 100vh; border: 1px solid var(--rule);
      }

      .eyebrow { font-size: clamp(11px, 1.2vw, 14px); letter-spacing: 0.22em; text-transform: uppercase; color: var(--accent); }
      .headline {
        font-family: "PP Neue Montreal", "Cabinet Grotesk Display", sans-serif;
        font-weight: 500;
        font-size: clamp(48px, 11vw, 200px);
        line-height: 0.98; letter-spacing: -0.025em; max-width: 16ch;
      }
      .headline .line { overflow: hidden; padding-bottom: 0.06em; }   /* SplitText line mask */
      .sub { font-size: clamp(15px, 1.6vw, 22px); max-width: 52ch; opacity: 0; line-height: 1.5; }
      .sub.in { opacity: 0.74; }   /* end state for reduced-motion (no opacity:0 lock-in) */

      /* Entrance elements hidden only when JS is active (D7). */
      .js .reveal { opacity: 0; }

      /* Dev-only chrome — hidden under reduced motion and during render (render.mjs injects #export-btn{display:none}). */
      #devtools { position: fixed; left: 0; right: 0; bottom: 0; z-index: 9; }
      #export-btn {
        position: fixed; right: 16px; top: 16px; z-index: 10;
        font: inherit; padding: 8px 14px; border: 1px solid var(--rule);
        background: var(--paper); color: var(--ink); cursor: pointer; border-radius: 999px;
      }
      #export-status {
        position: fixed; right: 16px; top: 58px; z-index: 10; max-width: 360px; margin: 0;
        padding: 10px 12px; background: var(--ink); color: var(--paper);
        font: 12px/1.5 ui-monospace, "SF Mono", Menlo, monospace; border-radius: 8px; white-space: pre-wrap;
      }
      @media (prefers-reduced-motion: reduce) { #export-btn, #export-status { display: none; } }
    </style>
  </head>
  <body>
    <main class="stage">
      <p class="eyebrow reveal">A note on craft</p>
      <h1 class="headline">Slow work, made visible.</h1>
      <p class="sub">Hand-finished cookware, cast one piece at a time.</p>
    </main>

    <!-- GSDevTools mount (dev only; render.mjs hides it via window.__RENDERING + injected CSS). -->
    <div id="devtools"></div>

    <!-- Export affordance (dev only). Browsers can't spawn Node — this just prints the command. -->
    <button id="export-btn" type="button">Export video</button>
    <pre id="export-status" hidden></pre>

    <!-- Dev aspect-ratio preview: append ?ar=9/16 (or 1/1, 4/3…) to the URL. -->
    <script>
      (() => {
        const m = /(?:[?&]ar=)([^&]+)/.exec(location.search);
        if (m) {
          document.documentElement.style.setProperty("--ar", decodeURIComponent(m[1]));
          document.documentElement.classList.add("preview-ar");
        }
      })();
    </script>

    <!-- The choreography lives in scene.js. Bump ?v=N when iterating (browsers cache module scripts). -->
    <script type="module" src="./scene.js?v=1"></script>

    <!-- Dev-only timeline UI. Never mounts during render (window.__RENDERING). -->
    <script type="module">
      import { gsap } from "https://esm.sh/gsap@3.15.0";
      // G4: GSDevTools is a plugin — DEFAULT import from esm.sh (named import may resolve to undefined).
      import GSDevTools from "https://esm.sh/gsap@3.15.0/GSDevTools";

      const mount = () => {
        if (window.__RENDERING || !window.__studio || !window.__studio.tl) return;
        gsap.registerPlugin(GSDevTools);
        GSDevTools.create({ animation: window.__studio.tl, container: "#devtools" });
      };
      if (window.__studio && window.__studio.tl) mount();
      else window.addEventListener("__studio:ready", mount, { once: true });

      const btn = document.getElementById("export-btn");
      const status = document.getElementById("export-status");
      if (btn && !window.__RENDERING) {
        btn.addEventListener("click", () => {
          status.hidden = false;
          status.textContent =
            "In terminal:\n  npm install            # first time only\n  node render.mjs --preset 1080p\n  # presets: 1080p | 4k | vertical | square\n  # formats: --format mp4 | webm | mov";
        });
      }
    </script>
  </body>
</html>
