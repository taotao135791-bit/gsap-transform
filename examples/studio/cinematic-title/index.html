<!doctype html>
<!--
  Example /studio + video-grammar artifact — "AURORA Studio" cinematic title sequence.
  Demonstrates the .camera wrapper (push / pull), a match-cut transition, and beat-synced
  pacing at 120 BPM (Cinematic mode). Design Read: design-studio title sequence, Cinematic,
  amber accent on tinted off-black. Render:  node render.mjs --preset 1080p   (also: vertical | square)
-->
<html lang="en" class="no-js">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AURORA — Title Sequence</title>
    <script>document.documentElement.className = "js";</script>
    <style>
      :root {
        --bg: #0b0d10;            /* tinted off-black — never pure black */
        --ink: #f4f1ea;           /* tinted off-white — never pure white */
        --accent: #e8b04b;        /* single locked accent (F5/F6) */
        --mute: rgba(244, 241, 234, 0.6);
        --ar: 16/9;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 100%; height: 100%; background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; overflow: hidden; }
      body { font-family: "PP Neue Montreal", "Söhne", -apple-system, BlinkMacSystemFont, sans-serif; }

      .stage { position: relative; width: 100vw; height: 100vh; overflow: hidden; display: flex; align-items: center; justify-content: center; }
      .preview-ar .stage { width: auto; height: auto; aspect-ratio: var(--ar); max-width: 100vw; max-height: 100vh; border: 1px solid rgba(255, 255, 255, 0.08); }

      /* The virtual camera — GSAP animates scale/xPercent/yPercent here. transform-origin center. */
      .camera { position: relative; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; transform-origin: center center; }
      .preview-ar .camera { width: 100%; height: 100%; }

      .shot { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; text-align: center; padding: 6vmin; }
      .shot .title { font-weight: 500; font-size: clamp(56px, 12vw, 200px); line-height: 0.95; letter-spacing: -0.025em; max-width: 14ch; }
      .shot .title .line { overflow: hidden; padding-bottom: 0.06em; }   /* SplitText mask */
      .shot .big { font-family: "GT Sectra", "PP Editorial New", Georgia, serif; font-style: italic; font-size: clamp(80px, 18vw, 300px); color: var(--accent); line-height: 1; letter-spacing: -0.02em; }
      .shot .sub { font-size: clamp(14px, 1.6vw, 20px); letter-spacing: 0.22em; text-transform: uppercase; color: var(--mute); }
      .shot .mark { font-weight: 600; font-size: clamp(48px, 10vw, 160px); letter-spacing: 0.06em; }
      .shot .tag { font-size: clamp(12px, 1.3vw, 16px); letter-spacing: 0.2em; text-transform: uppercase; color: var(--mute); }

      .js .shot { opacity: 0; }

      #devtools { position: fixed; left: 0; right: 0; bottom: 0; z-index: 9; }
      #export-btn { position: fixed; right: 16px; top: 16px; z-index: 10; font: inherit; padding: 8px 14px; border: 1px solid var(--mute); background: var(--bg); color: var(--ink); cursor: pointer; border-radius: 999px; }
      #export-status { position: fixed; right: 16px; top: 58px; z-index: 10; max-width: 360px; margin: 0; padding: 10px 12px; background: var(--ink); color: var(--bg); font: 12px/1.5 ui-monospace, "SF Mono", Menlo, monospace; border-radius: 8px; white-space: pre-wrap; }
      @media (prefers-reduced-motion: reduce) { #export-btn, #export-status { display: none; } }
    </style>
  </head>
  <body>
    <main class="stage">
      <div class="camera">
        <section class="shot shot-1">
          <h1 class="title">Slow cinema,<br />fast tools.</h1>
        </section>
        <section class="shot shot-2">
          <span class="big">2026</span>
          <p class="sub">Reel · Volume 01</p>
        </section>
        <section class="shot shot-logo">
          <div class="mark">AURORA</div>
          <div class="tag">Studio · Est. 2019</div>
        </section>
      </div>
    </main>

    <div id="devtools"></div>
    <button id="export-btn" type="button">Export video</button>
    <pre id="export-status" hidden></pre>

    <script>
      (() => {
        const m = /(?:[?&]ar=)([^&]+)/.exec(location.search);
        if (m) { document.documentElement.style.setProperty("--ar", decodeURIComponent(m[1])); document.documentElement.classList.add("preview-ar"); }
      })();
    </script>

    <script type="module" src="./scene.js?v=1"></script>

    <script type="module">
      import { gsap } from "https://esm.sh/gsap@3.15.0";
      import GSDevTools from "https://esm.sh/gsap@3.15.0/GSDevTools";   // G4: default import

      const mount = () => {
        if (window.__RENDERING || !window.__studio || !window.__studio.tl) return;
        gsap.registerPlugin(GSDevTools);
        GSDevTools.create({ animation: window.__studio.tl, container: "#devtools" });
      };
      if (window.__studio && window.__studio.tl) mount();
      else window.addEventListener("__studio:ready", mount, { once: true });

      const btn = document.getElementById("export-btn");
      const status = document.getElementById("export-status");
      if (btn && !window.__RENDERING) {
        btn.addEventListener("click", () => {
          status.hidden = false;
          status.textContent = "In terminal:\n  npm install\n  node render.mjs --preset 1080p\n  # presets: 1080p | 4k | vertical | square";
        });
      }
    </script>
  </body>
</html>
