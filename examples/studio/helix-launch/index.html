<!doctype html>
<!--
  Helix — Linear-style developer-tool launch reel (刁钻甲方 test, iteration 2).
  Changes from v1 after creative-director review:
    - Inter Tight (loaded) so the type has weight, not Arial fallback.
    - Features LEFT-ALIGNED with 1.35 line-height — Linear's reel grammar, not the AI "centered list" tell.
    - Hairlines up to 0.16 alpha so they read as precise 1px rules, not smudge.
    - Violet collapsed to ONE anchor (the logo dot) — the three verbs are pure white; the brand
      color stops being "sprinkled accent" and becomes a single point of identity.
    - Accent desaturated to #6b73e0 (cooler, less "AI violet").
-->
<html lang="en" class="no-js">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Helix — Launch Reel</title>
    <script>document.documentElement.className = "js";</script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&display=swap");

      :root {
        --bg: #08090a;
        --ink: #f7f8f8;
        --accent: #6b73e0;        /* desaturated brand violet — single anchor, no gradient */
        --mute: rgba(247, 248, 248, 0.46);
        --line: rgba(247, 248, 248, 0.16);   /* raised from 0.10 → reads as a precise hairline */
        --ar: 9/16;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 100%; height: 100%; background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; overflow: hidden; }
      body { font-family: "Inter Tight", "Geist", "Inter Display", -apple-system, BlinkMacSystemFont, sans-serif; font-feature-settings: "ss01"; }

      .stage { position: relative; width: 100vw; height: 100vh; overflow: hidden; display: flex; align-items: center; justify-content: center; }
      .preview-ar .stage { width: auto; height: auto; aspect-ratio: var(--ar); max-width: 100vw; max-height: 100vh; border: 1px solid var(--line); }
      .camera { position: relative; width: 100vw; height: 100vh; display: flex; flex-direction: column; transform-origin: center center; }
      .preview-ar .camera { width: 100%; height: 100%; }

      .topbar { position: absolute; top: 8.5vh; left: 0; right: 0; display: flex; align-items: center; justify-content: center; gap: 11px; font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
      .topbar .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); display: inline-block; }   /* the ONE violet anchor */
      .topbar .v { color: var(--mute); font-weight: 400; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; }

      .shot { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; text-align: center; padding: 6vmin; }
      .eyebrow { font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--mute); font-weight: 500; }   /* eyebrow no longer violet — keeps accent singular */
      .headline { font-weight: 500; font-size: clamp(40px, 9vw, 150px); line-height: 1.02; letter-spacing: -0.028em; max-width: 15ch; }
      .headline .line { overflow: hidden; padding-bottom: 0.06em; }

      /* Features: LEFT-ALIGNED, generous 1.35 leading, hairline rules — Linear reel grammar. */
      .features { list-style: none; display: flex; flex-direction: column; width: min(82%, 680px); text-align: left; }
      .features li { font-size: clamp(22px, 5.2vw, 80px); font-weight: 500; letter-spacing: -0.022em; line-height: 1.35; padding: 5.2vmin 0; border-top: 1px solid var(--line); color: var(--ink); }
      .features li:last-child { border-bottom: 1px solid var(--line); }

      .mark { font-weight: 600; font-size: clamp(54px, 12vw, 200px); letter-spacing: -0.03em; }
      .cta { font-size: clamp(16px, 2.4vw, 30px); letter-spacing: 0.04em; color: var(--mute); }

      .js .shot { opacity: 0; }
      .js .topbar { opacity: 0; }

      #devtools { position: fixed; left: 0; right: 0; bottom: 0; z-index: 9; }
      #export-btn { position: fixed; right: 16px; top: 16px; z-index: 10; font: inherit; padding: 8px 14px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; border-radius: 999px; }
      #export-status { position: fixed; right: 16px; top: 58px; z-index: 10; max-width: 360px; margin: 0; padding: 10px 12px; background: var(--ink); color: var(--bg); font: 12px/1.5 ui-monospace, "SF Mono", Menlo, monospace; border-radius: 8px; white-space: pre-wrap; }
      @media (prefers-reduced-motion: reduce) { #export-btn, #export-status { display: none; } }
    </style>
  </head>
  <body>
    <main class="stage">
      <div class="camera">
        <div class="topbar"><span class="dot"></span> Helix <span class="v">v2.0</span></div>

        <section class="shot shot-intro">
          <p class="eyebrow">Now shipping</p>
          <h1 class="headline">Project management,<br />finally fast.</h1>
        </section>

        <section class="shot shot-features">
          <ul class="features">
            <li>Issues that stay in flow</li>
            <li>Cycles that ship on time</li>
            <li>Docs that sync themselves</li>
          </ul>
        </section>

        <section class="shot shot-cta">
          <div class="mark">Helix</div>
          <div class="cta">helix.app</div>
        </section>
      </div>
    </main>

    <div id="devtools"></div>
    <button id="export-btn" type="button">Export video</button>
    <pre id="export-status" hidden></pre>

    <script>
      (() => {
        const m = /(?:[?&]ar=)([^&]+)/.exec(location.search);
        if (m) { document.documentElement.style.setProperty("--ar", decodeURIComponent(m[1])); document.documentElement.classList.add("preview-ar"); }
      })();
    </script>

    <script type="module" src="./scene.js?v=2"></script>

    <script type="module">
      import { gsap } from "https://esm.sh/gsap@3.15.0";
      import GSDevTools from "https://esm.sh/gsap@3.15.0/GSDevTools";
      const mount = () => {
        if (window.__RENDERING || !window.__studio || !window.__studio.tl) return;
        gsap.registerPlugin(GSDevTools);
        GSDevTools.create({ animation: window.__studio.tl, container: "#devtools" });
      };
      if (window.__studio && window.__studio.tl) mount();
      else window.addEventListener("__studio:ready", mount, { once: true });
      const btn = document.getElementById("export-btn");
      const status = document.getElementById("export-status");
      if (btn && !window.__RENDERING) {
        btn.addEventListener("click", () => {
          status.hidden = false;
          status.textContent = "In terminal:\n  npm install\n  node render.mjs --preset vertical";
        });
      }
    </script>
  </body>
</html>
